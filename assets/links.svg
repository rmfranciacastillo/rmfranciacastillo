<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 160" width="2048" height="160" role="img" aria-labelledby="title desc">
<title id="title">02. LINKS section header</title><desc id="desc">A precisely cropped slice of the original Nachocode LINKS panel.</desc>




  <title id="title">Nachocode links</title>

  <desc id="desc">Five clickable racing tire cards for GitHub, LinkedIn, YouTube, Medium, and Website.</desc>



  <style>

    .bg{fill:#03131F}

    .grid{stroke:#0B3044;stroke-width:1;opacity:.55}

    .frame{fill:none;stroke:#04BCEB;stroke-width:3}

    .frame2{fill:none;stroke:#0A5D78;stroke-width:1.5;opacity:.7}

    .mono{font-family:"DejaVu Sans Mono","Liberation Mono",monospace}

    .number{fill:#FF3030;font-size:32px;font-weight:700}

    .heading{fill:#F0F4F8;font-size:34px;font-weight:500}

    .prompt{fill:#19D98B;font-size:27px}

    .command{fill:#0AD9F5;font-size:27px}

    .label{fill:#F0F4F8;font-size:27px;text-anchor:middle}

    .divider{stroke:#5A8DA6;stroke-width:2;opacity:.8}

    .tire{fill:#070B10;stroke:#66727E;stroke-width:4}

    .side{fill:#0A1017;stroke:#253442;stroke-width:3}

    .rim{fill:#101923;stroke:#344655;stroke-width:3}

    .spoke{stroke:#253441;stroke-width:7;stroke-linecap:round}

    .hub{fill:#0A1017;stroke:#657687;stroke-width:3}

    .brand{font-size:16px;font-weight:700;text-anchor:middle}

    .brandline{stroke-width:3}

    .ring{fill:none;stroke-width:12;stroke-linecap:round;stroke-dasharray:115 35}

    .ring-outline{fill:none;stroke:#10202D;stroke-width:3}

    .card:hover .tire{filter:url(#hoverGlow)}

    .card:focus .tire{filter:url(#focusGlow)}

    .github-tire { transform-box: fill-box; transform-origin: center center; transition: transform 0.25s cubic-bezier(.2,.8,.2,1); }

    .card:hover .github-tire { transform: translateX(5px) translateY(-3px) rotateY(12deg) scale(1.12); }

    .tire-depth { fill: #05080d; stroke: #3d4654; stroke-width: 5; }

    .tire-depth { transform: translateX(-8px); transition: transform .25s ease; }

    .card:hover .tire-depth { transform: translateX(-16px); }

    .github-shadow { transform-origin: center; transition: transform 0.25s ease, opacity 0.25s ease; }

    .card:hover .github-shadow { transform: scaleX(0.8) translateX(8px); opacity: 0.12; }

  </style>



  <defs>

    <filter id="hoverGlow" x="-30%" y="-30%" width="160%" height="160%">

      <feGaussianBlur stdDeviation="5" result="blur"/>

      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>

    </filter>

    <filter id="focusGlow" x="-30%" y="-30%" width="160%" height="160%">

      <feGaussianBlur stdDeviation="3" result="blur"/>

      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>

    </filter>

  </defs>



  <rect class="bg" width="2048" height="684"/>



  <g class="grid">

