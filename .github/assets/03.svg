      <text x="686" y="557" class="label" font-size="32" style="font-family:DejaVu Sans Mono, Liberation Mono, monospace;font-size:32px;font-weight:400;font-style:normal;letter-spacing:0.0000">Contributions</text>
      <path d="M516 720L529 716L543 698L555 679L567 671L580 686L594 695L608 685L620 674L633 680L646 660L659 651L671 658L685 647L697 651L710 637L724 640L738 628L751 637L764 644L777 636L791 647L805 630L818 614L831 609L844 594L856 621V738H516Z" fill="url(#cyanArea)" />
