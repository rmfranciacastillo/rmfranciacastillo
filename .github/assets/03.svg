      <g fill="#031b2a" stroke="#00eaff" stroke-width="6" filter="url(#glowCyan)">
        <ellipse cx="686" cy="260" rx="56" ry="27" />
        <path d="M630 260V350C630 365 655 379 686 379S742 365 742 350V260" fill="#031b2a" />
        <path d="M630 289C630 304 655 317 686 317S742 304 742 289M630 319C630 334 655 347 686 347S742 334 742 319M630 350C630 365 655 379 686 379S742 365 742 350" fill="none" />
