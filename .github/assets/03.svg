    <path d="M76 134H1750" stroke="#00dff7" stroke-width="1.5" opacity=".8" />
    <path d="M24 160H1814" stroke="#0b8299" stroke-width="1" opacity=".25" />
    
    <text x="56" y="102" class="heading red" font-size="32.68" style="font-family:DejaVu Sans Mono, Liberation Mono, monospace;font-size:32.68;font-weight:700;font-style:normal;letter-spacing:0" transform="translate(56.0 0) scale(0.75 1) translate(-56.0 0)">03.</text>
    <text x="152" y="102" class="heading white" font-size="32.68" style="font-family:DejaVu Sans Mono, Liberation Mono, monospace;font-size:32.68;font-weight:500;font-style:normal;letter-spacing:0" transform="translate(152.0 0) scale(0.75 1) translate(-152.0 0)">STATS</text>
    <text x="42" y="199" class="mono cyan" font-size="24.51" font-weight="700" style="font-family:DejaVu Sans Mono, Liberation Mono, monospace;font-size:24.51;font-weight:700;font-style:normal;letter-spacing:0" transform="translate(42.0 0) scale(0.75 1) translate(-42.0 0)">$</text>
    <text x="76" y="199" class="mono white" font-size="24.51" style="font-family:DejaVu Sans Mono, Liberation Mono, monospace;font-size:24.51;font-weight:400;font-style:normal;letter-spacing:0" transform="translate(76.0 0) scale(0.75 1) translate(-76.0 0)">gh</text>
    <text x="110" y="199" class="mono cyan" font-size="24.51" style="font-family:DejaVu Sans Mono, Liberation Mono, monospace;font-size:24.51;font-weight:400;font-style:normal;letter-spacing:0" transform="translate(110.0 0) scale(0.75 1) translate(-110.0 0)">stats</text>
    
