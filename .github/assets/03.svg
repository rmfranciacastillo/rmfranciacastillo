<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="501" viewBox="0 0 1500 501" role="img" aria-labelledby="title desc" preserveAspectRatio="none">
  <title id="title">03. Stats — GitHub activity</title>
  <desc id="desc">Cyberpunk terminal dashboard with editable text for stars, contributions, pull requests, and current streak.</desc>
  <svg x="0" y="0" width="1500" height="501" viewBox="0 0 1838 818" preserveAspectRatio="none" overflow="hidden">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#00121d" />
        <stop offset=".55" stop-color="#031b29" />
        <stop offset="1" stop-color="#00101a" />
      </linearGradient>
      <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#031b28" stop-opacity=".86" />
        <stop offset="1" stop-color="#00111c" stop-opacity=".96" />
      </linearGradient>
      <linearGradient id="cyanArea" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#00eaff" stop-opacity=".34" />
        <stop offset="1" stop-color="#00eaff" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="redArea" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#ff1b27" stop-opacity=".32" />
        <stop offset="1" stop-color="#ff1b27" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="yellowArea" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#ffdf00" stop-opacity=".28" />
        <stop offset="1" stop-color="#ffdf00" stop-opacity="0" />
      </linearGradient>
      <pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse">
        <path d="M90 0H0V90" fill="none" stroke="#0b7187" stroke-opacity=".27" stroke-width="1" />
        <circle cx="0" cy="0" r="1.6" fill="#10b8d0" fill-opacity=".25" />
      </pattern>
      <pattern id="smallGrid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M24 0H0V24" fill="none" stroke="#087087" stroke-opacity=".2" stroke-width=".7" />
      </pattern>
      <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="10" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glowRed" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="5" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glowYellow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="5" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .heading{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-weight:700;letter-spacing:1px}
      .white{fill:#eaf7ff}.cyan{fill:#00eaff}.red{fill:#ff2029}.yellow{fill:#ffdf00}
      .card{fill:url(#cardFill);stroke:#00cde8;stroke-width:1.8}
      .label{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:36px;fill:#edf8ff;text-anchor:middle}
      .value{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:76px;font-weight:700;text-anchor:middle}
      .trend{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .card-visual{opacity:0;animation:card-fade-in .7s ease-out forwards}
      #stars-card{animation-delay:0s}
      #contributions-card{animation-delay:.8s}
      #pull-requests-card{animation-delay:1.6s}
      #streak-card{animation-delay:2.4s}
      @keyframes card-fade-in{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.card-visual{animation:none;opacity:1}}
    </style>
    </defs>
    
