
name: GitHub Readme YouTube Cards

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate YouTube channel ID
        env:
          CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
        run: |
          if [ -z "$CHANNEL_ID" ]; then
            echo "::error::YOUTUBE_CHANNEL_ID repository variable is empty or missing."
            exit 1
          fi
          if [[ ! "$CHANNEL_ID" =~ ^UC[A-Za-z0-9_-]{22}$ ]]; then
            echo "::error::YOUTUBE_CHANNEL_ID does not look like a standard channel ID."
            exit 1
          fi
          echo "YouTube channel ID is configured."

      - uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          channel_id: ${{ vars.YOUTUBE_CHANNEL_ID }}
          max_videos: 4
          card_width: 400
          background_color: "#03121E"
          title_color: "#00F5D4"
          stats_color: "#B8C7D9"
          border_radius: 8
